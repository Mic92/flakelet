[workspace]
members = ["flakelet-core", "flakelet"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", default-features = false, features = ["std", "fs", "process", "system"] }
lexopt = "0.3"
tempfile = "3"
